name: Guest artifacts

on:
  pull_request:
    paths:
      - 'src/bin/charms-spell-checker'
      - 'src/bin/charms-proof-wrapper'
      - 'src/bin/charms-spell-checker-vk.bin'
      - 'src/bin/charms-proof-wrapper-vk.bin'
      - 'charms-spell-checker/**'
      - 'charms-client/**'
      - 'charms-data/**'
      - 'charms-app-runner/**'
      - 'charms-lib/src/lib.rs'
      - 'charms-proof-wrapper/src/**'
      - 'charms-proof-wrapper/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.dockerignore'
      - '.github/workflows/guests.yml'
  push:
    branches: ['main']

concurrency:
  group: guests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install file
        run: |
          if ! command -v file >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes file
          fi

      - name: Rebuild the guests and fail on byte drift
        run: charms-spell-checker/check-guests.sh

      - name: Upload rebuilt guest outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guest-outputs
          if-no-files-found: error
          path: |
            src/bin/charms-spell-checker
            src/bin/charms-proof-wrapper
            src/bin/charms-spell-checker-vk.bin
            src/bin/charms-proof-wrapper-vk.bin
            charms-proof-wrapper/src/lib.rs
            charms-lib/src/lib.rs
