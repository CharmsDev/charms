name: Ethereum contracts

on:
  pull_request:
    paths: ['ethereum/**', '.github/workflows/ethereum.yml']
  push:
    branches: ['main']
    paths: ['ethereum/**', '.github/workflows/ethereum.yml']

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ethereum
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5

      - name: Install dependencies
        run: forge soldeer install

      - name: Check formatting
        run: forge fmt --check

      - name: Build within the EIP-170 size limit
        run: forge build --sizes

      - name: Check the storage layout
        run: scripts/check-storage-layout.py

      - name: Test
        run: forge test
