[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
# ETHEREUM_CHARMS is a CREATE2 address over this bytecode, so keep it free of path-dependent metadata.
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
    { access = "read", path = "./test/vectors" },
    { access = "read", path = "./out" },
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[soldeer]
remappings_generate = false
remappings_regenerate = false

[dependencies]
"@openzeppelin-contracts" = "5.7.0"
forge-std = "1.17.0"
sp1-contracts = { version = "6.1.0", git = "https://github.com/succinctlabs/sp1-contracts.git", tag = "v6.1.0" }
