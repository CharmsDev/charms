[package]
name = "scrolls_litecoin"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = { version = "1.0.104" }
bech32 = { version = "0.11.1" }
bitcoin = { version = "0.32" }
candid = { version = "0.10.39" }
charms-data = { version = "16.0.0", path = "../../../charms-data" }
charms-lib = { version = "16.0.0", path = "../../../charms-lib" }
getrandom = { version = "0.2", features = ["custom"] }
hex = { version = "0.4" }
ic-cdk = { version = "0.20.3" }
ic-cdk-management-canister = { version = "0.1" }
ic-cdk-timers = { version = "1.0" }
ic-vetkeys = { version = "0.7" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { version = "0.9.34" }
