[package]
name = "charms_metadata"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = { version = "0.10.39" }
charms-data = { version = "16.0.0", path = "../../../charms-data" }
charms-lib = { version = "16.0.0", path = "../../../charms-lib" }
getrandom = { version = "0.2", features = ["custom"] }
hex = { version = "0.4.3" }
ic-cdk = { version = "0.20.3" }
ic-cdk-management-canister = { version = "0.1" }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
serde = { version = "1.0.229", features = ["derive"] }
sha3 = { version = "0.10.9", default-features = false }

[dev-dependencies]
bitcoin = { version = "0.32", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
