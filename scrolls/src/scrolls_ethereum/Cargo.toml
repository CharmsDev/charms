[package]
name = "scrolls_ethereum"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
alloy = { version = "1.0.37", default-features = false, features = ["consensus", "rlp"] }
alloy-rlp = "0.3.12"
alloy-trie = "0.9.1"
candid = { version = "0.10.37" }
ethereum_ssz = "0.9"
getrandom = { version = "0.2", features = ["custom"] }
helios-consensus-core = { path = "../../vendor/helios-consensus-core" }
hex = { version = "0.4.3" }
ic-cdk = { version = "0.20.3" }
ic-cdk-management-canister = { version = "0.3" }
ic-cdk-timers = { version = "1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tree_hash = "0.10.0"

[dev-dependencies]
alloy = { version = "1.0.37", default-features = false, features = ["consensus", "rlp"] }
bls12_381 = { version = "0.8.0", features = ["experimental"] }
hex = { version = "0.4.3" }
serde_json = "1.0"
sha2_v9 = { package = "sha2", version = "0.9" }
ssz_types = "0.11"
